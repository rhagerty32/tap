[package]
name = "tap"
version = "0.2.5"
description = "Press-and-hold to get a coworker's attention"
authors = ["Tap Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "tap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
mdns-sd = "0.11"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "2"
dirs = "5"
subtle = "2"
base64 = "0.22"
if-addrs = "0.13"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
window-vibrancy = "0.6"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

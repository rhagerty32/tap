<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <script>
      try {
        var tapTheme = localStorage.getItem("tap-theme");
        if (tapTheme === "light" || tapTheme === "dark") document.documentElement.dataset.theme = tapTheme;
      } catch (e) {}
    </script>
  </head>
  <body class="settings-app">
    <div id="settings"></div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
